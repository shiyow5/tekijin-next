# TEKIJIN backend — tooling config.
# Configures the formatter (ruff), linter (ruff), and test runner (pytest + coverage).

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Sensible default rule set. Adjust when the spec lands.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["tekijin"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts `Depends(...)` in argument defaults;
# this is intentional and safe (FastAPI resolves it per request), so B008 must not
# flag it. (ruff already treats fastapi.Query/Header/etc. as immutable.)
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --cov=tekijin --cov-report=term-missing --cov-fail-under=90 -m 'not model'"
markers = [
    # 実モデルを読む重いテスト。既定では走らせない（CI を軽く保つため）。
    # 実機で `pytest -m model --no-cov` として回す。#137 のような
    # 「依存の pin では既定モデルを読めない」を CI 以外で検出するための枠。
    "model: downloads/loads the real embedding model (run on a GPU host)",
]

[tool.coverage.run]
source = ["tekijin"]
omit = [
    # uvicorn entry point — instantiation is covered, no runtime branch to test.
    "src/tekijin/main.py",
    # eval CLI shell — thin wiring around the tested run_eval core; needs a live
    # seeded DB + model download, so it is exercised via `python -m tekijin.eval`.
    "src/tekijin/eval/__main__.py",
    # migrate CLI shell — thin wrapper around the tested apply_migrations();
    # exercised via `python -m tekijin.data.migrate`.
    "src/tekijin/data/migrate.py",
    # Discord bot shell — discord.py client wiring around the tested ask_backend /
    # format_reply; needs a bot token and a live Gateway connection.
    "src/tekijin/discord_bot/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"

# These third-party libs ship no type stubs / py.typed marker; don't fail
# type-checking on their imports (they are lazily imported anyway).
[[tool.mypy.overrides]]
module = ["pgvector.*", "sudachipy.*", "rank_bm25.*", "sentence_transformers.*", "langgraph.*"]
ignore_missing_imports = true
